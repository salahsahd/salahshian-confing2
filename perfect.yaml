      - "VMess-HK"

  # 2. گروه اختصاصی هوش مصنوعی
  - name: "🤖 AI (Auto)"
    type: url-test
    url: "https://chatgpt.com"
    interval: 300
    tolerance: 50
    proxies:
      - "US-AI-1 (Reality)"
      - "US-AI-2 (Reality)"
      - "US-AI-3 (Reality)"
      - "US-AI-4 (Reality)"
