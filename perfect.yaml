  # 1. گروه اختصاصی MMOBI (فقط سرورهای خودمان)
  - name: "MMOBI"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - "US-AI-1 (Reality)"
      - "US-AI-2 (Reality)"
