mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

# ==================== تنظیمات DNS ====================
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 8.8.8.8
    - 1.1.1.1
    - https://dns.google/dns-query
  fallback:
    - 9.9.9.9
    - 208.67.222.222

# ==================== دریافت خودکار سرورها ====================
proxy-providers:
  # منبع اول: مخزن Kobabi (به‌روزرسانی خودکار)
  kobabi:
    type: http
    url: "https://raw.githubusercontent.com/liketolivefree/kobabi/main/clash_mt_ir_prov_l.yaml"
    interval: 3600
    path: ./providers/kobabi.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

  # منبع دوم: NoMoreWalls
  nowalls:
    type: http
    url: "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.meta.yml"
    interval: 3600
    path: ./providers/nowalls.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

  # منبع سوم: Airport (تست شده و پایدار)
  airport:
    type: http
    url: "https://raw.githubusercontent.com/dongchengjie/airport/main/subs/merged/tested_within.yaml"
    interval: 3600
    path: ./providers/airport.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

# ==================== گروه‌های پروکسی ====================
proxy-groups:
  # --- گروه خودکار اصلی (انتخاب سریع‌ترین سرور از بین همه منابع) ---
  - name: "🚀 انتخاب خودکار (همه کارها)"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    use:
      - kobabi
      - nowalls
      - airport

  # --- گروه اختصاصی هوش مصنوعی (فقط سرورهای آمریکا) ---
  - name: "🤖 هوش مصنوعی (AI)"
    type: url-test
    url: "https://chatgpt.com"
    interval: 300
    tolerance: 50
    use:
      - kobabi
      - nowalls
      - airport

  # --- گروه انتخاب دستی (با فیلتر کشورها) ---
  - name: "🎯 انتخاب دستی"
    type: select
    proxies:
      - "🚀 انتخاب خودکار (همه کارها)"
      - "🤖 هوش مصنوعی (AI)"
      - DIRECT
    use:
      - kobabi
      - nowalls
      - airport

# ==================== قوانین ====================
rules:
  # 1. شبکه‌های داخلی و لوکال
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT

  # 2. سایت‌های ایرانی مستقیم باز شوند
  - DOMAIN-SUFFIX,ir,DIRECT
  - GEOIP,IR,DIRECT

  # 3. هدایت هوشمند سایت‌های هوش مصنوعی به گروه اختصاصی AI
  - DOMAIN-SUFFIX,openai.com,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,chatgpt.com,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,anthropic.com,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,claude.ai,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,gemini.google.com,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,bard.google.com,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,deepseek.com,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,grok.com,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,x.ai,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,perplexity.ai,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,copilot.microsoft.com,🤖 هوش مصنوعی (AI)

  # 4. بقیه ترافیک‌ها از گروه خودکار عبور کنند
  - MATCH,🚀 انتخاب خودکار (همه کارها)
