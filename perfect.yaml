# ==================== گروه‌های پروکسی ====================
proxy-groups:
  # 1. گروه خودکار برای همه کارها (ترکیب سرورهای ثابت + سرورهای خودکار)
  - name: "🚀 انتخاب خودکار (همه کارها)"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - "US-AI-1"
      - "US-AI-2"
      - "US-AI-3"
    use:
      - kobabi
      - nowalls
      - airport

  # 2. گروه اختصاصی هوش مصنوعی (فقط از سرورهای ثابت آمریکا استفاده می‌کند تا قطعی نداشته باشد)
  - name: "🤖 هوش مصنوعی (AI)"
    type: url-test
    url: "https://chatgpt.com"
    interval: 300
    tolerance: 50
    proxies:
      - "US-AI-1"
      - "US-AI-2"
      - "US-AI-3"

  # 3. انتخاب دستی
  - name: "🎯 انتخاب دستی"
    type: select
    proxies:
      - "🚀 انتخاب خودکار (همه کارها)"
      - "🤖 هوش مصنوعی (AI)"
      - DIRECT
    use:
      - kobabi
      - nowalls
      - airport

# ==================== منابع قوانین ====================
rule-providers:
  iran-domains:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ir.txt"
    path: ./ruleset/iran-domains.txt
    interval: 86400

  iran-ip:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ircidr.txt"
    path: ./ruleset/iran-ip.txt
    interval: 86400

  ads:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ads.txt"
    path: ./ruleset/ads.txt
    interval: 86400

# ==================== قوانین نهایی ====================
rules:
  # 1. مسدود کردن تبلیغات
  - RULE-SET,ads,REJECT

  # 2. شبکه‌های داخلی و لوکال
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT

  # 3. سایت‌های ایرانی مستقیم باز شوند
  - RULE-SET,iran-domains,DIRECT
  - RULE-SET,iran-ip,DIRECT,no-resolve
  - DOMAIN-SUFFIX,ir,DIRECT
  - GEOIP,IR,DIRECT

  # 4. هدایت هوشمند سایت‌های هوش مصنوعی به گروه اختصاصی
  - DOMAIN-SUFFIX,openai.com,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,chatgpt.com,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,anthropic.com,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,claude.ai,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,gemini.google.com,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,bard.google.com,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,deepseek.com,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,grok.com,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,x.ai,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,perplexity.ai,🤖 هوش مصنوعی (AI)
  - DOMAIN-SUFFIX,copilot.microsoft.com,🤖 هوش مصنوعی (AI)

  # 5. بقیه ترافیک‌ها از گروه خودکار عبور کنند
  - MATCH,🚀 انتخاب خودکار (همه کارها)
