# ============================================================
# کانفیگ نهایی و اصلاح‌شده (ترکیب سرورهای خودکار و هوش مصنوعی)
# ============================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

# ==================== تنظیمات DNS ====================
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - https://dns.google/dns-query
  fallback:
    - 9.9.9.9
    - 208.67.222.222
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.chatgpt.com'
    - '+.openai.com'
    - '+.anthropic.com'
    - '+.claude.ai'
    - '+.gemini.google.com'

# ==================== دریافت خودکار سرورها (برای وبگردی) ====================
proxy-providers:
  kobabi:
    type: http
    url: "https://raw.githubusercontent.com/liketolivefree/kobabi/main/clash_mt_ir_prov_l.yaml"
    interval: 3600
    path: ./providers/kobabi.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

  nowalls:
    type: http
    url: "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.meta.yml"
    interval: 3600
    path: ./providers/nowalls.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

  airport:
    type: http
    url: "https://raw.githubusercontent.com/dongchengjie/airport/main/subs/merged/tested_within.yaml"
    interval: 3600
    path: ./providers/airport.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

